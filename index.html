<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Chùa An Nhiên · Canvas V7 Fixed • UI mới</title>
<style>
:root{font-family:system-ui,'Segoe UI',sans-serif;color:#f7ecd5}
*{box-sizing:border-box}
body{margin:0;background:#102526;overflow:hidden}
canvas{display:block;width:100vw;height:100dvh;touch-action:manipulation;cursor:pointer}
button{font:inherit;cursor:pointer}
#hud{position:fixed;inset:0;pointer-events:none}
#stats{position:absolute;top:18px;left:20px;display:flex;flex-direction:column;gap:8px;filter:drop-shadow(0 4px 10px #0007)}
.eyebrow{font-weight:800;font-size:11px;color:#d7c9a0;letter-spacing:3px}
#count{font-size:clamp(28px,4.3vw,58px);font-weight:900;line-height:1;color:#fff0bd;text-shadow:0 2px 0 #62462d}
.small{font-size:12px;color:#eee1c3}
#top{position:absolute;right:20px;top:18px;display:flex;gap:8px}
.pill{background:#173c38df;border:1px solid #b9a36d88;padding:10px 14px;border-radius:14px;font-weight:700;backdrop-filter:blur(7px);font-size:12px}
.pill strong{color:#ffdf87;font-size:15px}
.bottom{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;white-space:nowrap}
.action{pointer-events:auto;border:1px solid #e8d6a6;background:linear-gradient(#f6e5bc,#cda875);color:#543820;border-radius:16px;padding:12px 22px;font-weight:800;box-shadow:0 5px #7c5132,0 8px 16px #0006}
.action:active{transform:translateY(3px);box-shadow:0 2px #7c5132}
.hint{color:#ffe9bb;text-shadow:0 2px 5px #000c;font-size:12px}
#veil{position:fixed;inset:0;background:#071818aa;display:none;z-index:3}
#veil.show{display:block}
#drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,100vw);background:#f3e8cd;color:#3e402f;z-index:4;transform:translateX(103%);transition:transform .3s cubic-bezier(.2,.9,.3,1);box-shadow:-8px 0 40px #0006;display:flex;flex-direction:column}
#drawer.show{transform:none}
.head{background:#31584d;color:#f8e8b7;padding:19px 20px;display:flex;justify-content:space-between;align-items:center}
.head h2{font-family:Georgia,serif;margin:0;font-size:23px}
.close{background:#ffffff20;border:1px solid #e3cda3;border-radius:10px;color:white;font-size:23px;width:38px;height:38px}
#items{overflow-y:auto;padding:16px;flex:1}
.tabs{display:flex;gap:6px;padding:12px 14px 0;background:#f3e8cd}
.tab{border:1px solid #cdbb94;background:#f9f2e0;border-radius:11px;padding:9px 12px;color:#675540;font-size:12px;font-weight:750;flex:1}
.tab.active{background:#31584d;color:white}
.item{display:flex;gap:13px;align-items:center;background:#fff9ed;border:1px solid #daccab;border-radius:15px;padding:12px;margin-bottom:10px}
.emoji{width:46px;height:46px;background:#e7dbc1;border-radius:12px;display:grid;place-items:center;font-size:25px}
.itext{flex:1;min-width:0}.itext b{font-size:14px}.itext small{display:block;color:#86765e;font-size:11px;margin-top:4px;line-height:1.35}
.buy{border:0;border-radius:10px;background:#38755a;color:white;font-size:12px;font-weight:800;padding:10px}.buy:disabled{background:#bdbaab;color:#f8f6e8;cursor:not-allowed}
.foot{padding:12px 18px;color:#776e5a;background:#e9ddc3;font-size:11px;line-height:1.5}
#toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);color:#ffefbe;font-weight:800;text-shadow:0 2px 8px #0009;opacity:0;transition:opacity .2s;pointer-events:none}#toast.on{opacity:1}
@media(max-width:650px){#top{top:auto;bottom:85px;right:10px}.pill{padding:8px;font-size:10px}#stats{left:12px;top:12px}#count{font-size:30px}.bottom{bottom:17px}.hint{display:none}}
</style>
</head>
<body>
<canvas id="game" aria-label="Sân chùa và mõ gỗ, nhấn mõ để tích công đức"></canvas>
<div id="hud">
  <div id="stats"><div class="eyebrow">☸ CHÙA AN NHIÊN</div><div id="count">✦ 0</div><div class="small" id="rate">+1 / gõ · +0 / giây</div></div>
  <div id="top"><div class="pill">🪷 Cảnh chùa <strong id="buildnum">0/5</strong></div><div class="pill">☀️ Gõ mõ <strong id="hits">0</strong></div></div>
  <div class="bottom"><span class="hint">Click vào mõ hoặc nhấn SPACE</span><button id="shop" class="action">☰ Phường công đức</button></div>
</div>
<div id="veil"></div>
<aside id="drawer">
  <div class="head"><div><div style="font-size:11px;letter-spacing:2px">CỬA HÀNG</div><h2>Phường công đức</h2></div><button id="close" class="close">×</button></div>
  <div class="tabs"><button class="tab active" data-tab="mõ">Mõ</button><button class="tab" data-tab="cảnh">Cảnh chùa</button><button class="tab" data-tab="trợ">Trợ duyên</button></div>
  <div id="items"></div>
  <div class="foot">Mỗi loại mõ mua một lần. Công trình xuất hiện ngay trên Canvas. Mõ gỗ và sân chùa Canvas được thiết kế lại. Tiến độ bản demo lưu trên thiết bị.</div>
</aside>
<div id="toast"></div>
<audio id="sound" preload="auto" src="./mo-go.mp3"></audio>
<script>
(()=>{'use strict';
const cvs=document.getElementById('game'), c=cvs.getContext('2d');
let W=1200,H=760,sx=1,sy=1,viewX=0,viewY=0,viewScale=1,last=performance.now(),t=0,menu=false,tab='mõ';
let floaters=[],petals=[],ripples=[],smokes=[],sparkles=[];
let shake=0,swing=0,impact=0,drumPulse=0;
const catalog=[
{id:'m1',cat:'mõ',name:'Mõ gỗ trầm',icon:'🪵',price:75,power:2},
{id:'m2',cat:'mõ',name:'Mõ đồng cổ',icon:'🔔',price:5000,power:12},
{id:'m3',cat:'mõ',name:'Mõ ngọc bích',icon:'💎',price:250000,power:100},
{id:'m4',cat:'mõ',name:'Mõ thiên quang',icon:'✨',price:15000000,power:1500},
{id:'bamboo',cat:'cảnh',name:'Vườn trúc',icon:'🎋',price:250,rate:1},
{id:'lotus',cat:'cảnh',name:'Hồ sen',icon:'🪷',price:2200,rate:5},
{id:'lantern',cat:'cảnh',name:'Đèn lồng',icon:'🏮',price:15000,rate:20},
{id:'tree',cat:'cảnh',name:'Đào cổ thụ',icon:'🌸',price:145000,rate:75},
{id:'bell',cat:'cảnh',name:'Tháp chuông',icon:'🛕',price:1500000,rate:400},
{id:'incense',cat:'trợ',name:'Hương trầm',icon:'🕯️',price:45,rate:1,growth:1.65},
{id:'prayer',cat:'trợ',name:'Chuỗi hạt',icon:'📿',price:1200,rate:7,growth:1.75},
{id:'book',cat:'trợ',name:'Kinh thư',icon:'📜',price:28000,rate:45,growth:1.85},
{id:'aura',cat:'trợ',name:'Ánh phúc',icon:'☀️',price:990000,rate:400,growth:2}
];
let state;try{state=JSON.parse(localStorage.getItem('congduc_canvas_demo_v6'))}catch{}
if(!state||typeof state!=='object')state={score:0,hits:0,owned:{}};
state.score=Number(state.score)||0; state.hits=Number(state.hits)||0; state.owned=state.owned||{};
const save=()=>localStorage.setItem('congduc_canvas_demo_v6',JSON.stringify(state));
const owned=id=>state.owned[id]||0;
const power=()=>1+catalog.filter(i=>i.cat==='mõ'&&owned(i.id)).reduce((a,i)=>a+i.power,0);
const rate=()=>catalog.filter(i=>i.rate).reduce((a,i)=>a+i.rate*owned(i.id),0);
const fmt=n=>n>=1e12?(n/1e12).toFixed(2)+' nghìn tỷ':n>=1e9?(n/1e9).toFixed(2)+' tỷ':n>=1e6?(n/1e6).toFixed(2)+' triệu':Math.floor(n).toLocaleString('vi-VN');
const price=i=>Math.ceil(i.price*Math.pow(i.growth||1,owned(i.id)));
function resize(){const d=Math.min(devicePixelRatio||1,2);cvs.width=innerWidth*d;cvs.height=innerHeight*d;let pw=cvs.width,ph=cvs.height;viewScale=Math.min(pw/W,ph/H);viewX=(pw-W*viewScale)/2;viewY=(ph-H*viewScale)/2;c.setTransform(viewScale,0,0,viewScale,viewX,viewY);sx=viewScale;sy=viewScale;} addEventListener('resize',resize); resize();
function fill(x,y,w,h,col){c.fillStyle=col; c.fillRect(x,y,w,h)}
function round(x,y,w,h,r,col){c.fillStyle=col; c.beginPath(); c.roundRect(x,y,w,h,r); c.fill()}
function line(pts,col,w=2){c.beginPath(); c.moveTo(...pts[0]); for(const p of pts.slice(1))c.lineTo(...p); c.strokeStyle=col; c.lineWidth=w; c.stroke()}
function poly(pts,col){c.beginPath(); c.moveTo(...pts[0]); for(const p of pts.slice(1))c.lineTo(...p); c.closePath(); c.fillStyle=col; c.fill()}
function ellipse(x,y,rx,ry,col){c.beginPath(); c.ellipse(x,y,rx,ry,0,0,Math.PI*2); c.fillStyle=col; c.fill()}
function circle(x,y,r,col){ellipse(x,y,r,r,col)}
function sky(){
 const g=c.createLinearGradient(0,0,0,760);g.addColorStop(0,'#819f9d');g.addColorStop(.6,'#dfd1ad');g.addColorStop(1,'#f4dbac');fill(0,0,1200,760,g);
 let halo=c.createRadialGradient(845,145,4,845,145,370);halo.addColorStop(0,'#fff6d4cc');halo.addColorStop(1,'#fff0bb00');fill(0,0,1200,700,halo);
 // softly separated mountains
 for(let k=0;k<3;k++){
  c.beginPath();c.moveTo(0,490);c.lineTo(0,265+k*55);
  for(let x=0;x<=1200;x+=15)c.lineTo(x,278+k*54+25*Math.sin(x*.007+k)+15*Math.sin(x*.019+k*1.9));
  c.lineTo(1200,490);c.closePath();c.fillStyle=['#a8b6a5','#91a999','#789887'][k];c.fill();
 }
 fill(0,375,1200,120,'#e4d5b044');
}
function roof(cx,top,w,h){
 // three layered roofing surfaces
 poly([[cx-w*.48,top+h*.18],[cx-w*.31,top-h*.18],[cx+w*.31,top-h*.18],[cx+w*.48,top+h*.18],[cx+w*.4,top+h*.28],[cx-w*.4,top+h*.28]],'#5e4035');
 poly([[cx-w*.45,top+h*.14],[cx-w*.29,top-h*.13],[cx+w*.29,top-h*.13],[cx+w*.45,top+h*.14],[cx+w*.38,top+h*.20],[cx-w*.38,top+h*.20]],'#a85d42');
 for(let i=0;i<21;i++){let xx=cx-w*.29+i*w*.029;line([[xx,top-h*.13],[cx+(xx-cx)*1.42,top+h*.18]],'#cc8355',1.6)}
 line([[cx-w*.50,top+h*.15],[cx-w*.41,top+h*.17],[cx-w*.32,top-h*.07],[cx+w*.32,top-h*.07],[cx+w*.41,top+h*.17],[cx+w*.50,top+h*.15]],'#e2b46f',5);
}
function temple(){
 // darker facade as back layer
 ellipse(600,494,270,30,'#30443965');
 round(382,314,436,170,5,'#d6bd96');
 round(403,331,394,146,3,'#94684c');
 for(let i=0;i<7;i++){let x=424+i*57;round(x,337,15,135,2,'#614638');round(x+3,337,3,134,1,'#b4825e')}
 round(526,345,148,129,3,'#3f3028');
 for(let i=0;i<4;i++){line([[541+i*36,350],[541+i*36,469]],'#987250',3)}
 roof(600,296,520,154);
 round(531,294,138,30,5,'#264942');
 c.fillStyle='#f1d49a';c.textAlign='center';c.font='bold 17px Georgia,serif';c.fillText('CHÙA AN NHIÊN',600,314);
 // steps have genuine projected depth
 for(let i=0;i<5;i++){let y=476+i*13,w=250+i*18;poly([[600-w,y],[600+w,y],[600+w+13,y+12],[600-w-13,y+12]],i%2?'#9f9a81':'#c8b79b');line([[600-w,y],[600+w,y]],'#efe2c5',2)}
 // faint warm center light
 let h=c.createRadialGradient(600,397,5,600,397,145);h.addColorStop(0,'#ffd99344');h.addColorStop(1,'#ffd99300');fill(435,315,330,210,h);
}
function tree(x,y,s=1,pink=false){
 c.save();c.translate(x,y);c.scale(s,s);
 ellipse(0,5,62,13,'#32492c48');line([[0,2],[-3,-122],[-25,-147]],'#6b513b',15);line([[-2,-88],[32,-141]],'#6b513b',9);
 for(let i=0;i<11;i++){let a=i*2.4,rr=22+(i%3)*17;circle(Math.cos(a)*rr,-142+Math.sin(a)*rr*.63,27,pink?(i%3?'#e2acaa':'#f2c6bc'):(i%3?'#557f5d':'#6a956a'))}
 c.restore();
}
function lanternPost(x,y,s){c.save();c.translate(x,y);c.scale(s,s);ellipse(0,3,20,7,'#263b3050');round(-6,-98,12,100,3,'#6b4b37');poly([[-28,-101],[0,-123],[28,-101]],'#604634');round(-18,-100,36,42,5,'#ac704d');round(-13,-95,26,31,3,'#f5d28a');round(-22,-62,44,7,3,'#594636');c.restore()}
function lotus(x,y,r){for(let i=0;i<6;i++){let a=i*Math.PI/3;ellipse(x+Math.cos(a)*r*.36,y+Math.sin(a)*r*.25,r*.39,r*.33,'#f4b8b6')}circle(x,y,r*.2,'#efd27a')}
function pond(x,y){ellipse(x,y,148,42,'#67877c');ellipse(x,y,136,35,'#568d8f');for(let i=0;i<8;i++){let xx=x-107+i*31,yy=y+Math.sin(i*4)*14;ellipse(xx,yy,13,6,'#8cb38a')}for(let i=0;i<4;i++)lotus(x-88+i*59,y+Math.sin(i*3)*12,12)}
function bamboo(x,y,s){c.save();c.translate(x,y);c.scale(s,s);for(let i=0;i<4;i++){let xx=i*12-23;line([[xx,0],[xx-2,-140]],'#527d54',5);for(let j=0;j<3;j++){let yy=-45-j*32;poly([[xx,yy],[xx-49,yy-21],[xx-6,yy-10]],'#5b8b62');poly([[xx,yy-12],[xx+48,yy-32],[xx+4,yy-18]],'#3e6e54')}}c.restore()}
function ground(){
 let g=c.createLinearGradient(0,435,0,760);g.addColorStop(0,'#a9ac95');g.addColorStop(1,'#d2c09e');fill(0,440,1200,320,g);
 // paths with edges converging to temple
 poly([[495,477],[705,477],[1000,760],[200,760]],'#686f5f');
 poly([[506,477],[694,477],[955,760],[245,760]],'#c9b99a');
 for(let i=0;i<12;i++){let y=484+(i/12)**1.7*282,half=96+(y-477)*1.25;line([[600-half,y],[600+half,y]],'#a3947a75',1.5)}
 for(let a of [-1,1]){for(let i=0;i<5;i++){let y=494+i*i*13,x=600+a*(170+i*64);ellipse(x,y,8+i*1.1,3,'#efdec59a')}}
 // shaded side planting strips
 poly([[0,450],[420,475],[220,760],[0,760]],'#647b6077');
 poly([[1200,450],[780,475],[980,760],[1200,760]],'#647b6077');
}
function drawStriker(){
 const shaft=c.createLinearGradient(0,-9,0,10);shaft.addColorStop(0,'#dfaa76');shaft.addColorStop(1,'#7b4c34');
 round(-6,-7,148,15,7,shaft);
 round(-9,-10,15,21,5,'#a66f47');
 let h=c.createRadialGradient(-28,-12,2,-24,0,29);h.addColorStop(0,'#e4ac6f');h.addColorStop(.65,'#b47b4e');h.addColorStop(1,'#6b3d29');circle(-25,0,27,h);
 ellipse(-33,-12,10,6,'#f4d3a077');
}
function drawDrumAndMallet(){
 c.save();c.translate(600,628);
 ellipse(0,124,220,30,'#26322564');
 // low carved platform, not a tall pillar
 poly([[-202,73],[202,73],[187,109],[-187,109]],'#5e3e2c');
 poly([[-209,66],[209,66],[196,84],[-196,84]],'#9c724f');
 // cushion around the base
 ellipse(0,35,167,43,'#772a22');ellipse(0,29,159,37,'#a53d2e');
 c.strokeStyle='#deae71';c.lineWidth=3;c.beginPath();c.ellipse(0,29,145,32,0,0,Math.PI*2);c.stroke();
 for(let i=-1;i<=1;i++){lotus(i*67,35,10)}
 // natural proportion: low, broad wooden fish, hollow slit on upper-right
 c.save();c.translate(0,-22+impact*3);c.scale(1,1-drumPulse*.014);
 ellipse(0,73,138,20,'#40241755');
 let g=c.createLinearGradient(-130,-96,140,94);g.addColorStop(0,'#9a5a32');g.addColorStop(.38,'#d09658');g.addColorStop(.68,'#b97742');g.addColorStop(1,'#74412b');
 c.fillStyle=g;c.beginPath();c.moveTo(-139,38);c.bezierCurveTo(-151,-50,-94,-101,-16,-110);c.bezierCurveTo(82,-123,137,-47,140,34);c.bezierCurveTo(145,100,98,109,0,109);c.bezierCurveTo(-94,109,-140,96,-139,38);c.closePath();c.fill();
 c.strokeStyle='#79452d';c.lineWidth=4;c.stroke();
 // wood grain gentle and purposeful
 c.strokeStyle='#ffe0a53d';c.lineWidth=2;for(let i=0;i<6;i++){let y=-49+i*25;c.beginPath();c.moveTo(-99,y);c.bezierCurveTo(-50,y-10,40,y+8,99,y-4);c.stroke()}
 // compact carved scrolls (not a face)
 c.strokeStyle='#82492b';c.lineCap='round';c.lineWidth=6;
 for(let i=0;i<3;i++){let x=-74+i*69;c.beginPath();c.arc(x,-10+i%2*10,18,Math.PI*.1,Math.PI*1.7);c.stroke()}
 c.strokeStyle='#e7b97c';c.lineWidth=2.5;
 for(let i=0;i<3;i++){let x=-74+i*69;c.beginPath();c.arc(x,-10+i%2*10,18,Math.PI*.5,Math.PI*1.4);c.stroke()}
 // top slot: narrow dark opening with highlighted lip
 c.save();c.translate(69,-54);c.rotate(-.47);ellipse(0,0,35,12,'#ecc18a');ellipse(1,1,31,8,'#371e19');c.restore();
 // lower acoustic opening
 c.beginPath();c.moveTo(-119,68);c.quadraticCurveTo(0,51,119,68);c.quadraticCurveTo(0,85,-119,68);c.fillStyle='#4d2a1b';c.fill();
 c.beginPath();c.moveTo(-111,67);c.quadraticCurveTo(0,56,111,67);c.strokeStyle='#d8a66a';c.lineWidth=3;c.stroke();
 c.restore();
 // mallet rests right when idle; swings INTO the upper-right side
 c.save();c.translate(145,-74);
 const phase=1-swing;
 const angle=swing>0?-.66+Math.sin(Math.min(phase/.55,1)*Math.PI/2)*.82:0.23;
 c.rotate(angle);drawStriker();c.restore();
 if(impact>0){c.beginPath();c.arc(714,550,22+(1-impact)*24,0,Math.PI*2);c.strokeStyle=`rgba(255,222,157,${impact*.8})`;c.lineWidth=3;c.stroke()}
 c.restore();
}
function drawScene(dt){
 c.save();c.setTransform(1,0,0,1,0,0);c.fillStyle="#1e3432";c.fillRect(0,0,cvs.width,cvs.height);c.restore();sky();
 tree(84,427,.60);tree(1118,427,.66);
 temple();ground();
 // mid-ground on both sides
 tree(158,564,1.12,owned('tree')>0);tree(1050,563,1.12,owned('tree')>0);
 lanternPost(302,543,1.03);lanternPost(898,543,1.03);
 if(owned('bamboo')){bamboo(315,578,.8);bamboo(900,578,.8)}
 if(owned('lantern')){lanternPost(417,510,.6);lanternPost(783,510,.6)}
 if(owned('lotus')){pond(153,693);pond(1048,693)}
 if(owned('bell')){c.save();c.translate(1000,440);roof(0,-48,240,110);round(-80,-34,160,126,4,'#a7825c');ellipse(0,28,30,38,'#c39a58');c.restore()}
 // framed flowers and near-field stones
 for(let a of [-1,1]){let x=a===-1?75:1125;ellipse(x,738,122,31,'#576c5177');for(let i=0;i<8;i++)lotus(x+(i-4)*20,721+(i%3)*9,7)}
 // ambient floating petals
 for(let p of petals){c.save();c.globalAlpha=.65;c.translate(p.x,p.y);c.rotate(Math.sin(t*.001+p.p));ellipse(0,0,5,2.7,'#efc0b6');c.restore()}
 drawDrumAndMallet();
 for(let f of floaters){c.save();c.globalAlpha=Math.max(0,f.life/900);c.textAlign='center';c.font='bold 22px system-ui';c.shadowColor='#624125';c.shadowBlur=8;c.fillStyle='#fff0b5';c.fillText('+'+fmt(f.n)+' Công Đức',f.x,f.y);c.restore()}
 for(let r of ripples){c.beginPath();c.arc(600,565,r.r,0,Math.PI*2);c.strokeStyle=`rgba(250,225,154,${Math.max(0,r.life/420)*.48})`;c.lineWidth=2.5;c.stroke()}
 for(let s of sparkles){c.save();c.globalAlpha=Math.max(0,s.life/380);ellipse(s.x,s.y,3,2,'#ffe99d');c.restore()}
}

for(let i=0;i<22;i++) petals.push({x:Math.random()*1200,y:Math.random()*760,v:.35+Math.random()*.7,p:Math.random()*8});
function updateParticles(dt){
 for(const p of petals){p.x+=(Math.sin(t*.001+p.p)*.55+.35)*dt/16;p.y+=p.v*dt/16;if(p.x>1220)p.x=-20;if(p.y>770)p.y=-10;}
 floaters=floaters.filter(f=>{f.y-=dt*.09;f.life-=dt;return f.life>0});
 ripples=ripples.filter(r=>{r.r+=dt*.16;r.life-=dt;return r.life>0});
 sparkles=sparkles.filter(s=>{s.x+=s.vx*dt/16;s.y+=s.vy*dt/16;s.vy+=.015*dt;s.life-=dt;return s.life>0});
 if(swing>0){const prev=swing;swing=Math.max(0,swing-dt/180);if(prev>.56&&swing<=.56){impact=1;drumPulse=1;for(let i=0;i<8;i++)sparkles.push({x:715,y:550,life:260+Math.random()*120,vx:Math.random()*1.8-.9,vy:-Math.random()*1.8-.6});}}
 impact=Math.max(0,impact-dt/160);drumPulse=Math.max(0,drumPulse-dt/220);shake*=Math.pow(.86,dt/16);
}
function render(now){let dt=Math.min(now-last,45); last=now; t=now; updateParticles(dt); drawScene(dt); requestAnimationFrame(render)} requestAnimationFrame(render);
function refresh(){document.getElementById('count').textContent='✦ '+fmt(state.score); document.getElementById('rate').textContent='+'+fmt(power())+' / gõ · +'+fmt(rate())+' / giây'; document.getElementById('hits').textContent=fmt(state.hits); document.getElementById('buildnum').textContent=catalog.filter(i=>i.cat==='cảnh'&&owned(i.id)).length+'/5'}
function toast(msg){let el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.classList.remove('on'),1400)}
const soundPool=Array.from({length:6},()=>{const a=new Audio('./mo-go.mp3');a.preload='auto';a.volume=.72;return a});let soundIndex=0;
function playMo(){const a=soundPool[soundIndex];soundIndex=(soundIndex+1)%soundPool.length;try{a.pause();a.currentTime=0;const promise=a.play();if(promise)promise.catch(()=>{});}catch(e){console.warn('Không phát được âm thanh:',e)}}
function hit(){state.hits++; let n=power(); state.score+=n; shake=10; swing=1; impact=0; drumPulse=0; floaters.push({x:600+(Math.random()-.5)*120,y:500+Math.random()*36,life:900,n}); ripples.push({r:25,life:420}); playMo(); refresh(); save()}
function overDrum(x,y){let dx=(x-600)/160, dy=(y-600)/112; return dx*dx+dy*dy<1.3}
cvs.addEventListener('pointerdown',e=>{if(menu)return; let x=(e.clientX*(cvs.width/innerWidth)-viewX)/viewScale, y=(e.clientY*(cvs.height/innerHeight)-viewY)/viewScale; if(overDrum(x,y)) hit()});
addEventListener('keydown',e=>{if(e.key==='Escape')toggle(false); if(e.code==='Space'&&!menu&&e.target.tagName!=='BUTTON'){e.preventDefault(); hit()}});
function toggle(v){menu=v; document.getElementById('veil').classList.toggle('show',v); document.getElementById('drawer').classList.toggle('show',v); if(v)renderItems()}
document.getElementById('shop').onclick=()=>toggle(true); document.getElementById('close').onclick=()=>toggle(false); document.getElementById('veil').onclick=()=>toggle(false);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab; document.querySelectorAll('.tab').forEach(z=>z.classList.toggle('active',z===b)); renderItems()});
function renderItems(){let wrap=document.getElementById('items'); wrap.innerHTML=''; catalog.filter(i=>i.cat===tab).forEach(i=>{let single=i.cat!=='trợ',has=owned(i.id)>0,cost=price(i); const div=document.createElement('div'); div.className='item'; let em=document.createElement('div'); em.className='emoji'; em.textContent=i.icon; let info=document.createElement('div'); info.className='itext'; const name=document.createElement('b'); name.textContent=i.name+(has?' · '+(single?'Đã sở hữu':'Cấp '+owned(i.id)):''); const small=document.createElement('small'); small.textContent=(i.power?'+'+fmt(i.power)+' công đức/gõ':'+'+fmt(i.rate)+' công đức/giây')+' · '+(single?'Mua một lần':'Mua nhiều cấp'); info.append(name,small); const btn=document.createElement('button'); btn.className='buy'; btn.disabled=(single&&has)||state.score<cost; btn.textContent=single&&has?'✓ Đã mua':'✦ '+fmt(cost); btn.onclick=()=>{if(state.score<cost||(single&&owned(i.id)))return; state.score-=cost; state.owned[i.id]=owned(i.id)+1; save(); refresh(); renderItems(); toast('Đã nhận '+i.name+'!')}; div.append(em,info,btn); wrap.append(div)})}
setInterval(()=>{let r=rate(); if(r){state.score+=r/5; refresh(); save()}},200);
refresh();
})();
</script>
</body>
</html>
